[package]
name = "emcl-launcher"
version = "0.1.0"
description = "A cross-platform Minecraft launcher built with Tauri"
authors = ["EMCL Contributors"]
edition = "2021"

[lib]
name = "emcl_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "7"
futures-util = "0.3"
hex = "0.4"
md5 = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "stream"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
shell-words = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
sha2 = "0.10"
regex = "1"
notify = "8"
toml = "0.9"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
walkdir = "2"
zip = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
